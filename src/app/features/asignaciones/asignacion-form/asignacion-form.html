<div class="page">

  <div class="page-header">

    <h1>
      Asignar curso
    </h1>

    <p>
      Asigna un curso a un estudiante
    </p>

  </div>


  <div class="form-card">

    @if (errorMessage()) {

      <div class="alert-error">
        {{ errorMessage() }}
      </div>

    }


    @if (successMessage()) {

      <div class="alert-success">
        {{ successMessage() }}
      </div>

    }


    <form
      (ngSubmit)="asignar()"
    >

      <div class="form-group">

        <label for="estudiante">
          Estudiante
        </label>

        <select
          id="estudiante"
          name="idEstudiante"
          [(ngModel)]="idEstudiante"
        >

          <option
            [ngValue]="null"
            disabled
          >
            Selecciona un estudiante
          </option>


          @for (
            estudiante of estudiantes();
            track estudiante.idEstudiante
          ) {

            <option
              [ngValue]="estudiante.idEstudiante"
            >

              {{ estudiante.nombre }}
              {{ estudiante.apellido }}

              @if (estudiante.usuario?.username) {
                - {{ estudiante.usuario.username }}
              }

            </option>

          }

        </select>

      </div>


      <div class="form-group">

        <label for="curso">
          Curso
        </label>

        <select
          id="curso"
          name="idCurso"
          [(ngModel)]="idCurso"
        >

          <option
            [ngValue]="null"
            disabled
          >
            Selecciona un curso
          </option>


          @for (
            curso of cursos();
            track curso.idCurso
          ) {

            <option
              [ngValue]="curso.idCurso"
            >

              {{ curso.nombreCurso }}

              @if (curso.grado?.nombre) {
                - {{ curso.grado.nombre }}
              }

            </option>

          }

        </select>

      </div>


      <div class="form-actions">

        <button
          type="submit"
          class="btn-save"
          [disabled]="asignando()"
        >

          @if (asignando()) {

            Asignando...

          } @else {

            Asignar curso

          }

        </button>

      </div>

    </form>

  </div>

</div>
