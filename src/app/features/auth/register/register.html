<div class="register-page">

  <div class="register-card">

    <div class="register-header">

      <h1>
        Crear usuario
      </h1>

      <p>
        Ingresa tus datos para crear una cuenta
      </p>

    </div>

    @if (errorMessage()) {

      <div class="alert-error">
        {{ errorMessage() }}
      </div>

    }

    <form
      (ngSubmit)="registrar()"
    >

      <div class="form-group">

        <label for="username">
          Usuario
        </label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Ingresa un usuario"
          autocomplete="username"
        >

      </div>

      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingresa una contraseña"
          autocomplete="new-password"
        >

      </div>

      <div class="form-group">

        <label for="rol">
          Rol
        </label>

        <select
          id="rol"
          name="idRol"
          [(ngModel)]="idRol"
        >

          <option
            [ngValue]="null"
            disabled
          >
            Selecciona un rol
          </option>

          @for (
            rol of roles;
            track rol.id
          ) {

            <option
              [ngValue]="rol.id"
            >
              {{ rol.nombre }}
            </option>

          }

        </select>

      </div>

      <button
        type="submit"
        class="btn-register"
        [disabled]="guardando()"
      >

        @if (guardando()) {
          Creando cuenta...
        } @else {
          Crear cuenta
        }

      </button>

    </form>

    <div class="login-link">

      <span>
        ¿Ya tienes una cuenta?
      </span>

      <a routerLink="/login">
        Iniciar sesión
      </a>

    </div>

  </div>

</div>
